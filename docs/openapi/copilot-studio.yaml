openapi: 3.0.3
info:
  title: AzureBot Copilot Studio Connector
  version: 2.0.0
  description: >-
    Microsoft Copilot Studio custom connector for AzureBot grounded RAG and
    Microsoft Graph actions. Configure OAuth against the AzureBot API Entra
    application before importing into a tenant.
servers:
  - url: https://YOUR-AZUREBOT-HOST
paths:
  /api/copilot/ask:
    post:
      operationId: askAzureBot
      summary: Ask AzureBot a grounded question
      security: [{oauth2: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AskRequest'
      responses:
        '200':
          description: AzureBot answer with its normal RAG response payload
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400': {description: Invalid request}
        '401': {description: Authentication required}
        '403': {description: Authorization denied}
  /api/copilot/me:
    get:
      operationId: getMyProfile
      summary: Get the signed-in Microsoft 365 profile
      security: [{oauth2: []}]
      responses:
        '200':
          description: Microsoft Graph user profile
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        '401': {description: Authentication required}
        '403': {description: Graph permission denied}
  /api/copilot/sharepoint/search:
    get:
      operationId: searchSharePoint
      summary: Search authorized Microsoft 365 and SharePoint content
      security: [{oauth2: []}]
      parameters:
        - {name: q, in: query, required: true, schema: {type: string, maxLength: 300}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 10, default: 5}}
      responses:
        '200':
          description: Microsoft Graph search response
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        '401': {description: Authentication required}
        '403': {description: Graph permission denied}
  /api/copilot/mail/messages:
    get:
      operationId: getRecentMail
      summary: Get recent mail messages for the signed-in user
      security: [{oauth2: []}]
      parameters:
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 10, default: 5}}
      responses:
        '200':
          description: Recent mail messages
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        '401': {description: Authentication required}
        '403': {description: Graph permission denied}
  /api/copilot/calendar/events:
    get:
      operationId: getUpcomingCalendarEvents
      summary: Get upcoming calendar events for the signed-in user
      security: [{oauth2: []}]
      parameters:
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 10, default: 5}}
      responses:
        '200':
          description: Upcoming calendar events
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        '401': {description: Authentication required}
        '403': {description: Graph permission denied}
components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://login.microsoftonline.com/YOUR-TENANT-ID/oauth2/v2.0/authorize
          tokenUrl: https://login.microsoftonline.com/YOUR-TENANT-ID/oauth2/v2.0/token
          scopes:
            api://YOUR-API-CLIENT-ID/access_as_user: Access AzureBot as the signed-in user
  schemas:
    AskRequest:
      type: object
      required: [question]
      properties:
        question: {type: string, minLength: 1, maxLength: 4000}
        conversationId: {type: string}
